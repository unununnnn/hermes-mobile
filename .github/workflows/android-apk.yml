name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Capacitor Android plugin project
        # `cap update` regenerates the git-ignored capacitor-cordova-android-plugins
        # module without overwriting the committed web assets.
        run: npx cap update android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="apk-v$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          OUT="hermes-mobile-${VERSION}-debug-arm64.apk"
          cp "$APK" "$OUT"
          ls -l "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-debug-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Hermes Mobile ${{ steps.apk.outputs.version }} debug APK (${{ steps.apk.outputs.tag }})" \
            --notes "Debug-signed ARM64 (arm64-v8a) APK built by GitHub Actions from ${GITHUB_SHA}. Not production-signed."
